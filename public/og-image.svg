<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fondo)"/>

  <!-- Discos de fondo, ecos de la marca del favicon -->
  <g opacity="0.13" stroke="#ffffff" fill="none">
    <circle cx="1035" cy="150" r="210" stroke-width="2"/>
    <circle cx="1035" cy="150" r="140" stroke-width="2"/>
    <circle cx="150" cy="560" r="170" stroke-width="2"/>
  </g>

  <!-- Marca -->
  <g transform="translate(96,150)">
    <rect width="96" height="96" rx="24" fill="#ffffff" opacity="0.1"/>
    <circle cx="48" cy="48" r="26" stroke="#f97316" stroke-width="7" fill="none"/>
    <circle cx="48" cy="48" r="7.5" fill="#f97316"/>
  </g>

  <text x="96" y="330" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" fill="#ffffff" letter-spacing="-2">Ranking FEDV</text>

  <text x="96" y="402" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="500" fill="#c7d2fe">Ultimate frisbee en España</text>

  <rect x="96" y="452" width="112" height="5" rx="2.5" fill="#f97316"/>

  <text x="96" y="530" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#a5b4fc">Clasificaciones, torneos y equipos</text>

  <text x="96" y="576" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#b7bdf8">Federación Española de Disco Volador</text>
</svg>
