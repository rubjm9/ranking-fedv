<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*) para el notch y la barra inferior -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ranking FEDV - Ultimate Frisbee España</title>
    <meta name="description" content="Sistema de Ranking de Ultimate Frisbee en España - Federación Española de Disco Volador" />
    <meta name="google-site-verification" content="KeyqbUddoOdC_mgQ1RhLzeKVrRa7SeiOe2V-7y-zbGs" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Open Graph y Twitter Card. Son fijas a propósito: los rastreadores de
      WhatsApp, Twitter y LinkedIn no ejecutan JavaScript, así que lo que
      inyecte React desde usePageMeta no llega a la previsualización. Esto
      garantiza que todo enlace compartido muestre al menos la identidad del
      sitio; el título por entidad exige inyección en servidor.

      VITE_SITE_URL lo sustituye Vite al construir (sintaxis %VAR%).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ranking FEDV" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta property="og:description" content="Clasificaciones, campeonatos y equipos de ultimate frisbee en España. Federación Española de Disco Volador." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta name="twitter:description" content="Clasificaciones, campeonatos y equipos de ultimate frisbee en España." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!--
      Aplica el tema antes del primer pintado para evitar el destello de tema
      claro. Debe quedar sincronizado con src/hooks/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ranking-fedv-theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0b1120')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!-- Iconos y PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ranking FEDV">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
