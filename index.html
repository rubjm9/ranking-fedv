<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*) para el notch y la barra inferior -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ranking FEDV - Ultimate Frisbee España</title>
    <meta name="description" content="Ranking oficial de Ultimate Frisbee en España — clasificaciones, equipos y campeonatos de la FEDV." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index,follow" />
    <meta name="google-site-verification" content="KeyqbUddoOdC_mgQ1RhLzeKVrRa7SeiOe2V-7y-zbGs" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Open Graph y Twitter Card: fallback estático para crawlers sin JS (WhatsApp,
      LinkedIn, etc.). Tras navegar en la SPA, usePageMeta sobrescribe og:* y
      twitter:*; el prerender de cada ruta de entidad personaliza el HTML inicial.

      VITE_SITE_URL lo sustituye Vite al construir (sintaxis %VAR%).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ranking FEDV" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta property="og:description" content="Ranking oficial de Ultimate Frisbee en España — clasificaciones, equipos y campeonatos de la FEDV." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ranking FEDV — Ultimate frisbee en España" />
    <meta name="twitter:description" content="Ranking oficial de Ultimate Frisbee en España — clasificaciones, equipos y campeonatos de la FEDV." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!--
      Aplica el tema antes del primer pintado para evitar el destello de tema
      claro. Debe quedar sincronizado con src/hooks/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ranking-fedv-theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0b1120')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Fuentes self-hosted vía @fontsource en src/index.css -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ranking FEDV">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Federación Española de Disco Volador",
            "alternateName": "FEDV",
            "url": "https://fedv.es",
            "logo": "%VITE_SITE_URL%/og-image.jpg",
            "email": "comitedeportivo@fedv.es",
            "sameAs": ["https://fedv.es"]
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Ranking FEDV — Ultimate Frisbee España",
            "description": "Sistema oficial de ranking de Ultimate Frisbee en España",
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" },
            "inLanguage": "es-ES",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "%VITE_SITE_URL%/equipos?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
